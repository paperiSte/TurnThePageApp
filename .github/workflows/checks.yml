name: Rehearsal checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --test tests/player_state.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y libfluidsynth3
      - run: python setup_soundfont.py
      - run: python -m unittest discover -s tests_integration
